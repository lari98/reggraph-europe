<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>RegGraph Europe</title>
<link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<a class="skip" href="#board">Skip to content</a>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">RG</span>
    <div>
      <h1 id="title">RegGraph Europe</h1>
      <p class="sub" id="status" role="status" aria-live="polite"></p>
    </div>
    <span id="offline" class="badge badge-offline" hidden>OFFLINE</span>
  </div>
  <form id="controls" autocomplete="off">
    <label class="token-field"><span id="l-token">Access token</span>
      <input id="token" type="password" autocomplete="off" spellcheck="false" required></label>
    <label><span id="l-cur">Currency</span>
      <input id="currency" value="EUR" maxlength="3" size="4" pattern="[A-Za-z]{3}"></label>
    <label><span id="l-date">Date</span> <input id="asof" type="date"></label>
    <button type="submit" id="load">Load</button>
  </form>
</header>
<main id="board" tabindex="-1" aria-live="polite"></main>
<footer id="notice" class="foot"></footer>
<script src="/dashboard/app.js" defer></script>
</body>
</html>
